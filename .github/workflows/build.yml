name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test core
        run: dotnet test tests/Lumy.Core.Tests -c Release

      - name: Test phone remote
        run: dotnet test tests/Lumy.Remote.Tests -c Release

      - name: Build app (x64)
        run: dotnet publish src/Lumy.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/Lumy-win-x64

      - name: Smoke test (Lumy starts and stays open)
        shell: pwsh
        run: |
          Get-ChildItem artifacts/Lumy-win-x64 -Filter *.pri | Format-Table Name, Length
          $started = Get-Date
          $p = Start-Process artifacts/Lumy-win-x64/Lumy.exe -PassThru
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { Stop-Process $p -Force; "Lumy is running"; exit 0 }
          "Lumy exited with code $($p.ExitCode)"
          $log = Join-Path $env:LOCALAPPDATA 'Lumy/crash.log'
          if (Test-Path $log) { Get-Content $log }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
            Format-List TimeCreated, ProviderName, Message
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumy-win-x64
          path: artifacts/Lumy-win-x64
